<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Deneme Analiz V3 - Drive Entegrasyonlu</title>

  <!-- Google Identity Services (token client) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root{font-family:Inter,Arial,Helvetica,sans-serif}
    body{margin:16px;background:#fff;color:#111;transition:background 0.4s;}
    .dark{background:#0b0b0b;color:#eee}
    .colorful{transition:background 0.4s;}
    h1{margin:0 0 12px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    input[type="text"], select, input[type="date"], input[type="number"]{padding:6px;border:1px solid #ccc;border-radius:4px}
    button{padding:6px 8px;border-radius:6px;border:1px solid #888;background:#f0f0f0;cursor:pointer}
    button.secondary{background:#fff;border:1px solid #bbb}
    #studentList {margin-top:12px}
    .studentItem{padding:8px;border:1px solid #ddd;border-radius:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
    .studentInfo{font-weight:600}
    .controls button{margin-left:6px}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{border:1px solid #bbb;padding:6px;text-align:center;font-size:14px}
    .small{font-size:13px;padding:4px 6px}
    #audioToggle{position:fixed;right:12px;bottom:12px;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#222;color:#fff;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.2)}
    #audioToggle.muted{background:#aaa;color:#222}
    .modal{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.4);overflow:auto;z-index:999}
    .card{background:#fff;padding:16px;border-radius:8px;max-width:820px;width:96%;box-shadow:0 8px 30px rgba(0,0,0,0.15)}
    .card h3{margin-top:0}
    .fieldRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    label{display:flex;flex-direction:column;font-size:13px}
    .danger{background:#ffdddd;border-color:#ffaaaa}
    .right{margin-left:auto}
    .chartWrapper{overflow-x:auto;margin-top:12px;padding-bottom:8px}
    canvas{min-width:320px;max-height:300px}
    .successMsg {color:green; font-size:13px; margin-top:5px;}
    .toggleChartBtn {margin-bottom:4px;}
    .limitWarn {font-size:12px;color:red;}
    #driveList {margin-top:8px}
    .driveFile {padding:8px;border:1px solid #eee;border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
    .muted {opacity:0.6}
    @media (max-width:600px){
      .card{max-width:99vw;}
      canvas{min-width:200px;}
    }
  </style>
</head>
<body>
<h1>Deneme Analiz V3 (Drive Entegrasyonlu)</h1>

<div class="row">
  <div>
    Tema:
    <button onclick="app.setTheme('light')">Beyaz</button>
    <button onclick="app.setTheme('dark')">Siyah</button>
    <button onclick="app.setTheme('colorful')">Renkli</button>
  </div>
  <div style="margin-left:auto">
    <audio id="bgAudio" src="background.mp3" loop></audio>
    <small style="opacity:0.8">Soundtrack</small>
  </div>
</div>
<hr/>

<div class="card" style="margin-bottom:12px">
  <h3>Öğrenci Ekle</h3>
  <div class="fieldRow">
    <label>Adı <input id="inpName" type="text"></label>
    <label>Soyadı <input id="inpSurname" type="text"></label>
    <label>Bölümü
      <select id="inpType">
        <option value="Sayisal">Sayısal</option>
        <option value="Sozel">Sözel</option>
        <option value="EsitAgirlik">Eşit Ağırlık</option>
      </select>
    </label>
    <div class="right">
      <button onclick="app.addStudent()" class="small">Kaydet</button>
      <button onclick="app.clearAll()" class="small secondary">Tüm Verileri Sil</button>
    </div>
  </div>
  <div id="studentMsg" aria-live="polite"></div>
  <div style="font-size:13px;color:#555">Not: AYT denemesi eklerken öğrenci bölümü dikkate alınacak.</div>
</div>

<div class="card">
  <h3>Öğrenciler</h3>
  <div id="studentList"></div>
</div>

<div class="card" style="margin-top:12px">
  <h3>Google Drive Entegrasyonu</h3>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button id="btnAuthUpload" onclick="app.handleAuthAndUpload()" class="small">Google ile Giriş &amp; Drive'a Kaydet</button>
    <button id="btnAuthList" onclick="app.handleAuthAndList()" class="small secondary">Drive'den Yükle (Dosya Seç)</button>
    <button id="btnSignOut" onclick="app.signOut()" class="small" style="display:none">Oturumu Kapat</button>
  </div>
  <div id="googleDriveMsg" style="margin-top:8px" aria-live="polite"></div>
  <div id="driveList"></div>
</div>

<div id="modal" class="modal" style="display:none" tabindex="-1">
  <div class="card" id="modalCard">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px" id="modalFooter"></div>
  </div>
</div>

<div id="audioToggle" title="Müziği Aç/Kapa" onclick="app.toggleAudio()">🔈</div>

<script>
/*
  Deneme Analiz V3 - Drive entegrasyonlu tek dosya.
  Sağ üstte "Google ile Giriş & Drive'a Kaydet" dosyayı upload eder.
  "Drive'den Yükle (Dosya Seç)" kullanıcıya JSON dosyalarını listeler; seçim yapılırsa veriler indirilir ve uygulamaya yüklenir.
  Başarılı işlemler için görsel geri bildirimler eklenmiştir.
*/

const CLIENT_ID = '573578857813-ufs2jvgf44h2dro87u6tqa6d8h4gg965.apps.googleusercontent.com';
// Kullanılacak scope'lar: yükleme (dosya oluşturma) ve okunabilirlik (listeleme / indirme)
const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly';

const LS_KEY = 'deneme_analiz_v3_students';

const app = (function(){
  // State
  let students = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
  let modalStudentIdx = null, modalExamIdx = null;
  let tokenClient = null;
  let currentAccessToken = null;
  const pastelColors = ["#FFD1DC", "#B5FFFC", "#FDFD96", "#C1FFD7", "#E2C2FF", "#FFFACD", "#B7EDFA", "#E3F9DA", "#FFD6C6"];
  const charts = {};

  // elements
  const googleDriveMsgEl = () => document.getElementById('googleDriveMsg');
  const driveListEl = () => document.getElementById('driveList');

  // helpers
  function save(){ localStorage.setItem(LS_KEY, JSON.stringify(students)); }
  function uid(){ return Date.now() + Math.floor(Math.random()*999); }
  function idify(text){ if(!text) return ''; return text.toString().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9_]/g,'_'); }
  function norm(text){ return String(text || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/ı/g,'i'); }

  // Theme
  function setTheme(t){
    const body = document.body;
    if(t==='colorful'){
      let pastel = pastelColors[Math.floor(Math.random() * pastelColors.length)];
      body.className='colorful';
      body.style.background = pastel;
      body.style.color = '#222';
    }else if(t==='dark'){
      body.className='dark';
      body.style.background = '';
      body.style.color = '';
    }else{
      body.className='';
      body.style.background = '#fff';
      body.style.color = '#111';
    }
    localStorage.setItem('theme',t);
  }
  (function(){const t=localStorage.getItem('theme'); if(t) setTheme(t);})();

  // Audio
  const audio = document.getElementById('bgAudio');
  const audioToggle = document.getElementById('audioToggle');
  audio.volume = 0.12;
  audio.onerror = function(){ audio.style.display='none'; audioToggle.style.display='none'; }
  async function tryAutoPlay(){ try{ await audio.play(); audioToggle.textContent='🔊'; audioToggle.classList.remove('muted'); }catch(e){ audioToggle.textContent='🔈'; audioToggle.classList.add('muted'); } }
  tryAutoPlay();
  function toggleAudio(){ if(audio.paused){ audio.play(); audioToggle.textContent='🔊'; audioToggle.classList.remove('muted'); } else { audio.pause(); audioToggle.textContent='🔈'; audioToggle.classList.add('muted'); } }

  // Render students list
  function renderStudents(){
    const container = document.getElementById('studentList'); container.innerHTML='';
    if(students.length===0){
      container.innerHTML='<div style="color:#666">Henüz öğrenci yok.</div>'; return;
    }
    students.forEach((s,idx)=>{
      const div = document.createElement('div'); div.className='studentItem';
      const left = document.createElement('div');
      left.innerHTML = `<div class="studentInfo">${s.name} ${s.surname} <small style="font-weight:400">(${s.type})</small></div>
                        <div style="font-size:13px;color:#444">${(s.exams||[]).length} deneme</div>`;
      const right = document.createElement('div'); right.className='controls';
      const btnDetail = document.createElement('button'); btnDetail.textContent='Detay Gör';
      btnDetail.addEventListener('click', function(e){ e.stopPropagation(); showExams(idx); });
      const btnDelete = document.createElement('button'); btnDelete.textContent='Sil'; btnDelete.className='danger';
      btnDelete.addEventListener('click', function(e){ e.stopPropagation(); if(confirm('Öğrenciyi silmek istediğine emin misin?')){ students.splice(idx,1); save(); renderStudents(); }});
      right.appendChild(btnDetail); right.appendChild(btnDelete); div.appendChild(left); div.appendChild(right); container.appendChild(div);
    });
  }

  // Modal
  function showModal(title, bodyHtml, footerHtml){
    document.getElementById('modalTitle').innerHTML = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalFooter').innerHTML = footerHtml;
    const modal=document.getElementById('modal'); modal.style.display='flex'; modal.focus();
  }
  function closeModal(){ document.getElementById('modal').style.display='none'; modalStudentIdx=null; modalExamIdx=null; }
  document.getElementById('modal').addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  // Charts
  function drawChart(canvasId, denemeler){
    if(!document.getElementById(canvasId)) return;
    const labels = denemeler.map(ex=>ex.date||'');
    const nets = denemeler.map(ex=>Number(ex.toplamNet)||0);
    const bgColor = pastelColors[Math.floor(Math.random()*pastelColors.length)];
    const ctx = document.getElementById(canvasId).getContext('2d');
    if(charts[canvasId]) charts[canvasId].destroy();
    charts[canvasId] = new Chart(ctx, {
      type: 'line',
      data: { labels: labels, datasets: [{ label:'Toplam Net', data:nets, borderColor:'#007bff', backgroundColor:bgColor, fill:true, tension:0.3, pointBackgroundColor:bgColor, pointBorderColor:'#333'}] },
      options: { responsive:true, plugins:{legend:{display:true}}, scales:{ y:{ beginAtZero:true } } }
    });
  }

  // Dersler & limits
  function getDerslerFor(studentType,oturum){
    if(oturum==='TYT') return ['Mat','Turkce','Sosyal','Fen'];
    else if(studentType==='Sayisal') return ['Matematik','Fizik','Kimya','Biyoloji'];
    else if(studentType==='Sozel') return ['Turkce','Tarih1','Cografya1','Tarih2','Cografya2','Felsefe','Din'];
    else if(studentType==='EsitAgirlik') return ['Matematik','Turkce','Tarih1','Cografya1'];
    return [];
  }
  function getLimitForField(oturum,studentType,field){
    const limits={
      TYT:{Mat:40,Turkce:40,Sosyal:20,Fen:20},
      AYT:{
        Sayisal:{Matematik:40,Fizik:14,Kimya:13,Biyoloji:13},
        Sozal:{Turkce:24,Tarih1:10,Cografya1:6,Tarih2:11,Cografya2:11,Felsefe:12,Din:6},
        EsitAgirlik:{Matematik:40,Turkce:24,Tarih1:10,Cografya1:6}
      }
    };
    if(oturum==='TYT') return limits.TYT[field] ?? null;
    const raw = limits.AYT[studentType] || {};
    const map = {};
    Object.keys(raw).forEach(k => map[norm(k).toLowerCase()] = raw[k]);
    return map[norm(field).toLowerCase()] ?? null;
  }

  // Exams UI
  function toggleChart(chartId, btnId){
    const chartDiv = document.getElementById(chartId).parentNode;
    const btn = document.getElementById(btnId);
    if(chartDiv.style.display === 'none' || chartDiv.style.display === ''){
      chartDiv.style.display = (chartDiv.style.display === 'none') ? '' : '';
      btn.textContent = (btn.textContent === 'Grafiği Kapat') ? 'Grafiği Aç' : 'Grafiği Kapat';
    } else {
      chartDiv.style.display = 'none';
      btn.textContent = 'Grafiği Aç';
    }
  }

  function showExams(idx){
    modalStudentIdx = idx;
    const student = students[idx];
    const tytDenemeler = (student.exams || []).filter(e=>e.session==='TYT').slice().sort((a,b)=> (a.date||'').localeCompare(b.date||''));
    const aytDenemeler = (student.exams || []).filter(e=>e.session==='AYT').slice().sort((a,b)=> (a.date||'').localeCompare(b.date||''));
    function tableHtml(denemeler, dersler){
      if(denemeler.length===0) return '<tr><td colspan="99" style="color:#888">Henüz deneme yok.</td></tr>';
      return denemeler.map((ex,i)=>{
        let dersTd = dersler.map(ders=>{
          let d = ex.nets && ex.nets[ders] ? ex.nets[ders] : {};
          return `<td><span title="Doğru">${d.dogru??'-'}</span> / <span title="Yanlış">${d.yanlis??'-'}</span> / <b>${d.net??'-'}</b></td>`;
        }).join('');
        return `<tr>
          <td>${ex.date||'-'}</td>
          ${dersTd}
          <td><b>${ex.toplamNet??'-'}</b></td>
          <td>
            <button onclick="app.editExam(${idx},${i})" class="small">Düzenle</button>
            <button onclick="app.deleteExam(${idx},${i})" class="small danger">Sil</button>
          </td>
        </tr>`;
      }).join('');
    }

    let tytDersler = getDerslerFor(student.type, 'TYT');
    let aytDersler = getDerslerFor(student.type, 'AYT');
    let bodyHtml = `
      <button onclick="app.addExamForm(${idx})" class="small" style="margin-bottom:10px">+ Deneme Ekle</button>
      <div>
        <h4>TYT Denemeleri</h4>
        <table>
          <tr><th>Tarih</th>${tytDersler.map(d=>`<th>${d}</th>`).join('')}<th>Toplam Net</th><th>İşlem</th></tr>
          ${tableHtml(tytDenemeler, tytDersler)}
        </table>
        <button onclick="app.toggleChart('tytChart','btn_tytChart')" class="small secondary toggleChartBtn" id="btn_tytChart">Grafiği Aç</button>
        <div class="chartWrapper" style="display:none;"><canvas id="tytChart"></canvas></div>
      </div>
      <div>
        <h4>AYT Denemeleri</h4>
        <table>
          <tr><th>Tarih</th>${aytDersler.map(d=>`<th>${d}</th>`).join('')}<th>Toplam Net</th><th>İşlem</th></tr>
          ${tableHtml(aytDenemeler, aytDersler)}
        </table>
        <button onclick="app.toggleChart('aytChart','btn_aytChart')" class="small secondary toggleChartBtn" id="btn_aytChart">Grafiği Aç</button>
        <div class="chartWrapper" style="display:none;"><canvas id="aytChart"></canvas></div>
      </div>
    `;
    showModal(`${student.name} ${student.surname} - Denemeleri`, bodyHtml, `<button onclick="app.closeModal()" class="secondary">Kapat</button>`);
    setTimeout(function(){ drawChart('tytChart', tytDenemeler); drawChart('aytChart', aytDenemeler); },50);
  }

  // Exam add/edit forms
  function addExamForm(idx){ modalStudentIdx = idx; modalExamIdx = null;
    const oturumOpt = `<option value="TYT">TYT</option><option value="AYT">AYT</option>`;
    showModal("Deneme Ekle",
      `<label>Oturum
        <select id="examSession">${oturumOpt}</select>
      </label>
      <label>Tarih <input type="date" id="examDate"></label>
      <div id="dersFields"></div>
      <div id="examMsg"></div>`,
      `<button onclick="app.saveExam()" id="modalSave">Kaydet</button><button onclick="app.showExams(${idx})" class="secondary">Geri</button>`
    );
    document.getElementById('examSession').addEventListener('change', function(){ renderNetFields(); });
    renderNetFields();
  }

  function editExam(idx, exIdx){
    modalStudentIdx = idx; modalExamIdx = exIdx;
    const student = students[idx];
    const exam = student.exams[exIdx];
    const oturumOpt = `<option value="TYT"${exam.session==='TYT'?' selected':''}>TYT</option>
                       <option value="AYT"${exam.session==='AYT'?' selected':''}>AYT</option>`;
    showModal("Deneme Düzenle",
      `<label>Oturum
        <select id="examSession">${oturumOpt}</select>
      </label>
      <label>Tarih <input type="date" id="examDate" value="${exam.date || ''}"></label>
      <div id="dersFields"></div>
      <div id="examMsg"></div>`,
      `<button onclick="app.saveExam()" id="modalSave">Kaydet</button><button onclick="app.showExams(${idx})" class="secondary">Geri</button>`
    );
    document.getElementById('examSession').addEventListener('change', function(){ renderNetFields(exIdx); });
    renderNetFields(exIdx);
  }

  function renderNetFields(examIndex){
    const idx = modalStudentIdx; const exIdx = typeof examIndex === 'number' ? examIndex : null;
    const student = students[idx];
    const session = document.getElementById('examSession').value;
    const dersler = getDerslerFor(student.type, session);
    let html='';
    const nets = exIdx !== null && student.exams[exIdx] ? (student.exams[exIdx].nets || {}) : {};
    dersler.forEach(ders => {
      const safe = idify(ders);
      let dogru = nets[ders]?.dogru ?? '';
      let yanlis = nets[ders]?.yanlis ?? '';
      let net = (dogru !== '' && yanlis !== '') ? (Number(dogru) - (Number(yanlis)/4)).toFixed(2) : '';
      let lim = getLimitForField(session, student.type, ders) ?? '';
      html += `<label>${ders}
        <div style="display:flex;gap:4px;">
          <input type="number" id="dogru_${safe}" min="0" max="${lim}" value="${dogru}" placeholder="Doğru" oninput="app.inputLimitCheck('${safe}',${lim});app.calcNet('${safe}')">
          <input type="number" id="yanlis_${safe}" min="0" max="${lim}" value="${yanlis}" placeholder="Yanlış" oninput="app.inputLimitCheck('${safe}',${lim});app.calcNet('${safe}')">
          <input type="number" id="net_${safe}" value="${net}" readonly style="width:60px;">
        </div>
        <div class="limitWarn" id="limitWarn_${safe}"></div>
      </label>`;
    });
    document.getElementById('dersFields').innerHTML = html;
  }

  function inputLimitCheck(safeDers, lim){
    const dogEl = document.getElementById('dogru_' + safeDers);
    const yanEl = document.getElementById('yanlis_' + safeDers);
    if(!dogEl || !yanEl) return;
    let dogru = Number(dogEl.value) || 0;
    let yanlis = Number(yanEl.value) || 0;
    const warn = document.getElementById('limitWarn_' + safeDers);
    if(lim !== '' && (dogru + yanlis > lim)) warn.textContent = `Doğru+Yanlış toplamı en fazla ${lim} olabilir!`;
    else warn.textContent = '';
  }

  function calcNet(safeDers){
    const dog = Number(document.getElementById('dogru_' + safeDers).value) || 0;
    const yan = Number(document.getElementById('yanlis_' + safeDers).value) || 0;
    const net = (dog - (yan/4)).toFixed(2);
    const netEl = document.getElementById('net_' + safeDers);
    if(netEl) netEl.value = net;
  }

  function saveExam(){
    const idx = modalStudentIdx; const student = students[idx];
    const session = document.getElementById('examSession').value;
    const date = document.getElementById('examDate').value;
    const dersler = getDerslerFor(student.type, session);
    let nets = {}, msgEl = document.getElementById('examMsg'); msgEl.innerHTML=''; let hasError=false; let toplamNet=0;
    dersler.forEach(ders=>{
      const safe = idify(ders);
      const lim = getLimitForField(session, student.type, ders) ?? Infinity;
      let dogru = Number(document.getElementById('dogru_' + safe).value) || 0;
      let yanlis = Number(document.getElementById('yanlis_' + safe).value) || 0;
      if(isNaN(dogru) || dogru < 0 || dogru > lim){ hasError=true; msgEl.innerHTML += `<span style="color:red">${ders} doğru sayısı 0 ile ${lim} arasında olmalı.<br></span>`; }
      if(isNaN(yanlis) || yanlis < 0 || yanlis > lim){ hasError=true; msgEl.innerHTML += `<span style="color:red">${ders} yanlış sayısı 0 ile ${lim} arasında olmalı.<br></span>`; }
      if(dogru + yanlis > lim){ hasError=true; msgEl.innerHTML += `<span style="color:red">${ders} için doğru+yanlış toplamı en fazla ${lim} olabilir.<br></span>`; }
      let net = (dogru - (yanlis / 4)).toFixed(2);
      nets[ders] = {dogru, yanlis, net};
      toplamNet += Number(net);
    });
    if(hasError) return;
    if(modalExamIdx !== null){ student.exams[modalExamIdx] = {session, date, nets, toplamNet: toplamNet.toFixed(2)}; msgEl.innerHTML = '<span class="successMsg">Deneme güncellendi ✔️</span>'; }
    else { student.exams = student.exams || []; student.exams.push({session, date, nets, toplamNet: toplamNet.toFixed(2)}); msgEl.innerHTML = '<span class="successMsg">Deneme eklendi ✔️</span>'; }
    save(); setTimeout(function(){ showExams(idx); },600);
  }

  function deleteExam(idx, exIdx){
    if(confirm('Bu denemeyi silmek istiyor musun?')){ students[idx].exams.splice(exIdx,1); save(); showExams(idx); }
  }

  // Google Drive: authorization helper
  function ensureToken(onSuccess, onError){
    // lazily init tokenClient
    if(!tokenClient){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (resp) => {
          if(resp.error){
            if(onError) onError(resp);
            else googleDriveMsgEl().innerHTML = `<span style="color:red">Google auth hatası: ${resp.error}</span>`;
            return;
          }
          currentAccessToken = resp.access_token;
          // show sign-out button
          document.getElementById('btnSignOut').style.display = '';
          if(onSuccess) onSuccess(resp.access_token);
        }
      });
    }
    // request token (will prompt if needed)
    tokenClient.requestAccessToken();
  }

  // Upload current students to Drive (creates a new file)
  function uploadStudentsToDrive(accessToken){
    googleDriveMsgEl().innerHTML = 'Yükleniyor...';
    const fileContent = JSON.stringify(students, null, 2);
    const metadata = { name: 'deneme_analiz_verileri_' + (new Date()).toISOString().replace(/[:.]/g,'-') + '.json', mimeType: 'application/json' };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', new Blob([fileContent], { type: 'application/json' }));

    fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
      body: form
    })
    .then(res => res.json())
    .then(val => {
      if(val.id){
        const link = `https://drive.google.com/file/d/${val.id}/view?usp=sharing`;
        googleDriveMsgEl().innerHTML = `<span style="color:green">Veriler Drive'a kaydedildi ✔️ — <a href="${link}" target="_blank" rel="noopener">Dosyayı Aç</a></span>`;
      } else {
        googleDriveMsgEl().innerHTML = `<span style="color:red">Yükleme hatası: ${val.error?.message || 'Bilinmeyen hata'}</span>`;
      }
    })
    .catch(err => {
      console.error(err);
      googleDriveMsgEl().innerHTML = `<span style="color:red">Drive'a yüklenirken hata oluştu.</span>`;
    });
  }

  // List candidate JSON files in Drive (filter by name containing 'deneme_analiz_verileri' OR mimeType json)
  function listFilesOnDrive(accessToken){
    googleDriveMsgEl().innerHTML = 'Drive dosyaları alınıyor...';
    driveListEl().innerHTML = '';
    // Query: application/json files OR name contains deneme_analiz_verileri
    const q = encodeURIComponent(`mimeType='application/json' or name contains 'deneme_analiz_verileri'`);
    const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,createdTime,webViewLink)&pageSize=50&orderBy=createdTime desc`;
    fetch(url, { headers: { 'Authorization': 'Bearer ' + accessToken } })
      .then(res => res.json())
      .then(data => {
        if(!data.files || data.files.length === 0){
          googleDriveMsgEl().innerHTML = '<span style="color:orange">Drive üzerinde uygun JSON dosyası bulunamadı.</span>';
          return;
        }
        googleDriveMsgEl().innerHTML = `<span style="color:green">${data.files.length} dosya bulundu. İndirilecek dosyayı seçin.</span>`;
        driveListEl().innerHTML = data.files.map(f => {
          return `<div class="driveFile"><div><strong>${f.name}</strong><div style="font-size:12px;color:#666">${f.createdTime || ''}</div></div>
            <div style="display:flex;gap:6px">
              <button class="small" data-fileid="${f.id}" data-filename="${f.name}">Yükle</button>
              <a class="small secondary" href="${f.webViewLink || '#'}" target="_blank" rel="noopener">Aç</a>
            </div></div>`;
        }).join('');
        // attach listeners
        Array.from(driveListEl().querySelectorAll('button[data-fileid]')).forEach(btn=>{
          btn.addEventListener('click', function(){
            const fileId = this.getAttribute('data-fileid');
            const name = this.getAttribute('data-filename');
            if(confirm(`${name} dosyasını uygulamaya yüklemek istiyor musunuz? Mevcut veriler üzerine yazılacak.`)){
              fetchFileFromDrive(fileId, currentAccessToken);
            }
          });
        });
      })
      .catch(err => {
        console.error(err);
        googleDriveMsgEl().innerHTML = `<span style="color:red">Drive dosyaları alınırken hata oluştu.</span>`;
      });
  }

  function fetchFileFromDrive(fileId, accessToken){
    googleDriveMsgEl().innerHTML = 'Dosya indiriliyor...';
    const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`;
    fetch(url, { headers: { 'Authorization': 'Bearer ' + accessToken } })
      .then(res => {
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(json => {
        // Basic validation: expecting array or object with students list
        if(Array.isArray(json) || json.students || json.length){
          // if json is array of students, accept; if object has students key, use it.
          const loaded = Array.isArray(json) ? json : (json.students || []);
          if(!Array.isArray(loaded)){
            googleDriveMsgEl().innerHTML = `<span style="color:red">Dosya formatı beklendiği gibi değil.</span>`;
            return;
          }
          students = loaded;
          save();
          renderStudents();
          googleDriveMsgEl().innerHTML = `<span style="color:green">Drive'den veri başarıyla yüklendi ✔️ (${fileId})</span>`;
        } else {
          googleDriveMsgEl().innerHTML = `<span style="color:red">Dosya içinde öğrenci verisi bulunamadı.</span>`;
        }
      })
      .catch(err => {
        console.error(err);
        googleDriveMsgEl().innerHTML = `<span style="color:red">Dosya indirilemedi veya JSON parse hatası.</span>`;
      });
  }

  function signOut(){
    // revoke token if possible (best effort)
    if(currentAccessToken){
      fetch(`https://oauth2.googleapis.com/revoke?token=${currentAccessToken}`, { method: 'POST', headers: { 'Content-type': 'application/x-www-form-urlencoded' } })
        .then(()=>{ currentAccessToken = null; tokenClient = null; document.getElementById('btnSignOut').style.display = 'none'; googleDriveMsgEl().innerHTML = '<span style="color:green">Oturum kapatıldı.</span>'; })
        .catch(()=>{ currentAccessToken = null; document.getElementById('btnSignOut').style.display = 'none'; googleDriveMsgEl().innerHTML = '<span style="color:orange">Oturum kapatma sırasında uyarı oluştu.</span>'; });
    } else {
      googleDriveMsgEl().innerHTML = '<span style="color:orange">Önceden giriş yapılmamış.</span>';
    }
  }

  // Public functions for UI buttons
  function handleAuthAndUpload(){
    ensureToken(function(accessToken){
      uploadStudentsToDrive(accessToken);
    }, function(err){
      googleDriveMsgEl().innerHTML = `<span style="color:red">Google kimlik doğrulaması başarısız.</span>`;
    });
  }

  function handleAuthAndList(){
    ensureToken(function(accessToken){
      listFilesOnDrive(accessToken);
    }, function(err){
      googleDriveMsgEl().innerHTML = `<span style="color:red">Google kimlik doğrulaması başarısız.</span>`;
    });
  }

  // Public small API for existing UI actions (add student, etc.)
  function addStudent(){
    const name = document.getElementById('inpName').value.trim();
    const surname = document.getElementById('inpSurname').value.trim();
    const type = document.getElementById('inpType').value;
    const msgEl = document.getElementById('studentMsg'); msgEl.innerHTML='';
    if(!name || !surname){ msgEl.innerHTML = '<span style="color:red">Ad ve soyad gerekli</span>'; return; }
    if(students.some(s=> s.name.toLowerCase()===name.toLowerCase() && s.surname.toLowerCase()===surname.toLowerCase())){
      msgEl.innerHTML = '<span style="color:red">Bu isimde bir öğrenci zaten var.</span>'; return;
    }
    students.push({id: uid(), name, surname, type, exams: []});
    save(); renderStudents();
    document.getElementById('inpName').value=''; document.getElementById('inpSurname').value='';
    msgEl.innerHTML = '<span class="successMsg">Öğrenci eklendi ✔️</span>';
  }

  function clearAll(){ if(confirm('Tüm verileri silmek istediğine emin misin?')){ students=[]; save(); renderStudents(); closeModal(); googleDriveMsgEl().innerHTML=''; driveListEl().innerHTML=''; } }

  // expose methods needed by inline handlers inside rendered HTML content
  return {
    setTheme,
    toggleAudio,
    addStudent,
    clearAll,
    renderStudents,
    showExams,
    addExamForm,
    editExam,
    saveExam,
    deleteExam,
    inputLimitCheck,
    calcNet,
    drawChart,
    toggleChart,
    // Drive methods
    handleAuthAndUpload,
    handleAuthAndList,
    signOut,
    // internal helpers used by generated html (edit/delete buttons)
    closeModal
  };
})();

// initial render
app.renderStudents();

// Make app available globally for inline handlers created dynamically
window.app = app;
</script>
</body>
</html>
